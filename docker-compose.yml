# ============================================================
# Docker Compose — Sistema Clínica (producción/desarrollo con Docker)
# ------------------------------------------------------------
# Levanta 3 servicios:
#   db   -> PostgreSQL 15 (el esquema inicial se aplica automáticamente
#           desde backend/db/init.sql en el primer arranque).
#   api  -> Backend Node.js/Express (Dockerfile.backend) en el puerto 3000.
#   web  -> Frontend Angular compilado servido por Nginx (Dockerfile.frontend)
#           en el puerto 80 (y 443 con certificados).
#   integration_test -> contenedor efímero que corre la prueba integral
#           (backend/db/test_full_flow.js) contra los servicios levantados.
#
# Variables obligatorias: DB_PASSWORD y JWT_SECRET (fallan si no existen).
# El resto tienen valores por defecto razonables (ver .env.example).
# ============================================================
version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: clinica_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?error}
      POSTGRES_DB: ${DB_NAME:-clinica_colas}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinica_colas"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Express: expone el puerto 3000. Se conecta a la BD por el
  # hostname 'db' de la red interna de Docker (no localhost).
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: clinica_api
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?error}
      DB_NAME: ${DB_NAME:-clinica_colas}
      JWT_SECRET: ${JWT_SECRET:?error}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200,http://localhost}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: clinica_web
    ports:
      - "80:80"
    depends_on:
      - api

  integration_test:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: clinica_integration_test
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?error}
      DB_NAME: ${DB_NAME:-clinica_colas}
      JWT_SECRET: ${JWT_SECRET:?error}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200,http://localhost}
      API_BASE: http://api:3000/api
    depends_on:
      api:
        condition: service_started
    command: >
      sh -c "
        sleep 5 &&
        node backend/db/test_full_flow.js
      "

volumes:
  pg_data:
