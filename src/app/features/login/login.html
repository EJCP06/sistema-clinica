<div class="min-h-screen w-screen bg-slate-50 dark:bg-slate-950 flex items-center justify-center p-4 relative overflow-hidden">
  
  <!-- Decorative background elements -->
  <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-600/10 dark:bg-blue-600/5 rounded-full blur-[120px] animate-pulse"></div>
  <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-teal-500/10 dark:bg-teal-500/5 rounded-full blur-[120px] animate-pulse delay-700"></div>

  <!-- Theme Toggle (Top Right) -->
  <div class="absolute top-8 right-8 z-50 flex items-center gap-3 bg-white/50 dark:bg-slate-900/50 backdrop-blur-md p-2 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
    <lucide-icon [name]="Sun" class="w-4 h-4 text-amber-500"></lucide-icon>
    <label class="relative inline-flex items-center cursor-pointer group">
      <input type="checkbox" [checked]="isDarkMode" (change)="toggleDarkMode()" class="sr-only peer" />
      <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 peer-checked:bg-blue-600 shadow-inner transition-none"></div>
    </label>
    <lucide-icon [name]="Moon" class="w-4 h-4" [class.text-blue-400]="isDarkMode" [class.text-slate-300]="!isDarkMode"></lucide-icon>
  </div>

  <div class="w-full max-w-5xl flex flex-col lg:flex-row rounded-[40px] overflow-hidden shadow-2xl bg-white dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800 relative z-10 backdrop-blur-xl">

    <!-- Panel Izquierdo (Branding & Info) -->
    <div class="hidden lg:flex lg:w-[45%] flex-col justify-between p-14 bg-blue-600 relative overflow-hidden">
      <!-- Background pattern -->
      <div class="absolute inset-0 opacity-10">
        <div class="absolute top-0 left-0 w-full h-full" style="background-image: radial-gradient(circle at 2px 2px, white 1px, transparent 0); background-size: 24px 24px;"></div>
      </div>
      
      <div class="relative z-10">
        <div class="flex items-center gap-4 mb-16">
          <div class="w-14 h-14 bg-white p-1.5 backdrop-blur-md rounded-2xl flex items-center justify-center border border-white/30 shadow-xl">
            <img
              src="/logo-cnc.png"
              alt="CNC Logo"
              class="w-full h-full object-contain"
              onerror="this.src = 'https://ui-avatars.com/api/?name=CNC&background=0D9488&color=fff'"
            />
          </div>
          <span class="text-3xl font-black tracking-tight text-white">SisCol</span>
        </div>

        <h1 class="text-5xl font-black leading-tight text-white mb-8 tracking-tighter">
          Gestión de <br>
          <span class="text-blue-200">Salud Inteligente</span>
        </h1>
        <p class="text-blue-100 text-lg leading-relaxed font-medium opacity-90 max-w-sm">
          Optimiza la atención de tus pacientes con nuestro sistema de colas de última generación.
        </p>
      </div>

      <div class="relative z-10 mt-12">
        <p class="text-[10px] font-black text-blue-200 uppercase tracking-[3px] mb-6">Accesos de Demostración</p>
        <div class="grid grid-cols-1 gap-3">
          <button *ngFor="let cuenta of cuentasDemo.slice(0, 3)"
            (click)="usarCuenta(cuenta.user)"
            class="flex items-center gap-4 p-4 rounded-2xl bg-white/10 hover:bg-white/20 transition-all border border-white/10 hover:border-white/30 group backdrop-blur-sm">
            <span class="text-2xl filter drop-shadow-md">{{ cuenta.icon }}</span>
            <div class="flex-1">
              <span class="text-sm font-black text-white block tracking-tight">{{ cuenta.label }}</span>
              <span class="text-[10px] text-blue-100 font-bold opacity-70 uppercase tracking-wider">{{ cuenta.user }}</span>
            </div>
            <lucide-icon [name]="LogIn" class="w-4 h-4 text-white/40 group-hover:text-white group-hover:translate-x-1 transition-all"></lucide-icon>
          </button>
        </div>
      </div>
    </div>

    <!-- Panel Derecho (Login Form) -->
    <div class="w-full lg:w-[55%] p-10 lg:p-20 flex flex-col justify-center bg-white dark:bg-transparent transition-colors">
      <div class="max-w-sm mx-auto w-full">
        <div class="mb-12">
          <div class="flex items-center gap-3 lg:hidden mb-10">
            <div class="w-12 h-12 bg-white p-1.5 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-600/20 border border-slate-200 dark:border-slate-800">
              <img
                src="/logo-cnc.png"
                alt="CNC Logo"
                class="w-full h-full object-contain"
                onerror="this.src = 'https://ui-avatars.com/api/?name=CNC&background=0D9488&color=fff'"
              />
            </div>
            <span class="text-2xl font-black text-slate-900 dark:text-white">SisCol</span>
          </div>
          <h2 class="text-4xl font-black text-slate-900 dark:text-white tracking-tight">Bienvenido</h2>
          <p class="text-slate-500 dark:text-slate-400 mt-3 font-medium">Ingresa tus credenciales para acceder</p>
        </div>

        <!-- Error Alert -->
        <div *ngIf="error" class="mb-8 p-4 rounded-2xl bg-rose-50 dark:bg-rose-500/10 border border-rose-100 dark:border-rose-500/20 text-rose-600 dark:text-rose-400 text-sm font-bold flex items-center gap-3 animate-in fade-in slide-in-from-top-2">
          <lucide-icon [name]="XCircle" class="w-5 h-5 shrink-0"></lucide-icon>
          <span>{{ error }}</span>
        </div>

        <form (ngSubmit)="iniciarSesion()" class="space-y-6">
          <div class="space-y-2">
            <label class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-[2px] ml-1">Cédula</label>
            <div class="relative group">
              <div class="absolute inset-y-0 left-0 pl-5 flex items-center text-slate-400 dark:text-slate-500 group-focus-within:text-blue-600 transition-colors">
                <lucide-icon [name]="User" class="w-5 h-5"></lucide-icon>
              </div>
              <input type="text" [(ngModel)]="username" name="username" placeholder="Ej: 31596888"
                class="w-full pl-14 pr-5 py-4 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-800 rounded-2xl text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-600 focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-600 dark:focus:border-blue-500 transition-all font-medium">
            </div>
          </div>

          <div class="space-y-2">
            <label class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-[2px] ml-1">Contraseña</label>
            <div class="relative group">
              <div class="absolute inset-y-0 left-0 pl-5 flex items-center text-slate-400 dark:text-slate-500 group-focus-within:text-blue-600 transition-colors">
                <lucide-icon [name]="Lock" class="w-5 h-5"></lucide-icon>
              </div>
              <input [type]="mostrarPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" placeholder="••••••••"
                class="w-full pl-14 pr-14 py-4 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-800 rounded-2xl text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-600 focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-600 dark:focus:border-blue-500 transition-all font-medium">
              <button type="button" (click)="mostrarPassword = !mostrarPassword"
                class="absolute inset-y-0 right-0 pr-5 flex items-center text-slate-400 hover:text-blue-600 transition-colors">
                <lucide-icon [name]="mostrarPassword ? EyeOff : Eye" class="w-5 h-5"></lucide-icon>
              </button>
            </div>
          </div>

          <div class="pt-10">
            <button type="submit" [disabled]="cargando"
              class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 dark:disabled:bg-slate-800 text-white font-black py-5 rounded-2xl shadow-xl shadow-blue-600/20 hover:shadow-blue-600/40 hover:-translate-y-0.5 active:translate-y-0 transition-all flex items-center justify-center gap-3 text-sm uppercase tracking-widest">
              <span *ngIf="!cargando" class="flex items-center gap-2">
                Iniciar Sesión
                <lucide-icon [name]="LogIn" class="w-5 h-5"></lucide-icon>
              </span>
              <div *ngIf="cargando" class="flex items-center gap-3">
                <div class="w-5 h-5 border-3 border-white/30 border-t-white rounded-full animate-spin"></div>
                <span>Validando...</span>
              </div>
            </button>
          </div>
        </form>

        <div class="mt-12 text-center">
          <p class="text-xs text-slate-400 dark:text-slate-600 font-bold uppercase tracking-wider">SisCol v2.0 &bull; Clínica Central</p>
        </div>
      </div>
    </div>

  </div>
</div>
