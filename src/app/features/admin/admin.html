<!--
  Plantilla del panel de administración (admin.ts).
  Layout: sidebar + header + contenedor que muestra UNA pestaña activa a la
  vez (reports, personal, especialidades, roles, permisología).
-->
<div class="h-[100dvh] bg-slate-50 dark:bg-slate-950 flex overflow-hidden w-full">
  <div class="shrink-0 z-20">
    <app-sidebar
      [activeTab]="activeTab"
      [sidebarOpen]="sidebarOpen"
      (tabChange)="cambiarTab($event)"
      (closeSidebar)="sidebarOpen = false"
    >
    </app-sidebar>
  </div>

  <main
    class="flex-1 flex flex-col min-w-0 overflow-hidden relative bg-slate-50 dark:bg-slate-950 lg:pl-80"
  >
    <app-header
      [title]="
        activeTab === 'reports'
          ? 'Dashboard Global'
          : activeTab === 'stats'
            ? 'Análisis de Datos'
            : activeTab === 'personal'
              ? 'Gestión del Personal'
              : activeTab === 'especialidades'
                ? 'Gestión de Especialidades'
                : activeTab === 'roles'
                ? 'Gestión de Roles'
                : activeTab === 'permisologia'
                ? 'Permisología'
                : 'Gestión de Consultorios'
      "
      [subtitle]="
        activeTab === 'reports'
          ? 'Resumen operativo en tiempo real'
          : activeTab === 'stats'
            ? 'Productividad y tendencias'
            : activeTab === 'personal'
              ? 'Administración de usuarios del sistema'
              : activeTab === 'especialidades'
                ? 'Configuración de servicios clínicos'
                : activeTab === 'roles'
                ? 'Administración de roles y permisos'
                : activeTab === 'permisologia'
                ? 'Matriz de permisos por rol'
                : 'Gestión de consultorios and ubicaciones'
      "
      [showLogo]="false"
      [showMenuButton]="true"
      (toggleSidebar)="sidebarOpen = !sidebarOpen"
    >
    </app-header>

    <div class="flex-1 overflow-y-auto px-4 pt-4 pb-4 md:px-8 md:pt-8 md:pb-8 flex flex-col" style="scrollbar-width: none; -ms-overflow-style: none;">
      <style>
        .flex-1::-webkit-scrollbar { display: none; }
      </style>
      <ng-container *ngIf="permisosListos">
        <app-admin-reports *ngIf="activeTab === 'reports' || activeTab === 'stats'" class="flex flex-col flex-1"></app-admin-reports>

        <app-admin-personal *ngIf="activeTab === 'personal'" class="flex flex-col flex-1"></app-admin-personal>

        <app-admin-especialidades *ngIf="activeTab === 'especialidades'" class="flex flex-col flex-1"></app-admin-especialidades>
        <app-admin-roles *ngIf="activeTab === 'roles'" class="flex flex-col flex-1"></app-admin-roles>
        <app-admin-permisologia *ngIf="activeTab === 'permisologia'" class="flex flex-col flex-1"></app-admin-permisologia>
      </ng-container>
    </div>
  </main>
</div>
