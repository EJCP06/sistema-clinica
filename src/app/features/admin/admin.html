<div class="h-[100dvh] bg-slate-50 dark:bg-slate-950 flex overflow-hidden w-full">
  <div class="shrink-0 z-20">
    <app-sidebar
      [activeTab]="activeTab"
      [sidebarOpen]="sidebarOpen"
      (tabChange)="cambiarTab($event)"
      (closeSidebar)="sidebarOpen = false"
    >
    </app-sidebar>
  </div>

  <main
    class="flex-1 flex flex-col min-w-0 overflow-hidden relative bg-slate-50 dark:bg-slate-950 lg:pl-80"
  >
    <app-header
      [title]="
        activeTab === 'reports'
          ? 'Dashboard Global'
          : activeTab === 'stats'
            ? 'Análisis de Datos'
            : activeTab === 'personal'
              ? 'Gestión del Personal'
              : activeTab === 'especialidades'
                ? 'Gestión de Especialidades'
                : activeTab === 'roles'
                ? 'Gestión de Roles'
                : 'Gestión de Consultorios'
      "
      [subtitle]="
        activeTab === 'reports'
          ? 'Resumen operativo en tiempo real'
          : activeTab === 'stats'
            ? 'Productividad y tendencias'
            : activeTab === 'personal'
              ? 'Administración de usuarios del sistema'
              : activeTab === 'especialidades'
                ? 'Configuración de servicios clínicos'
                : activeTab === 'roles'
                ? 'Administración de roles y permisos'
                : 'Gestión de consultorios and ubicaciones'
      "
      [showLogo]="false"
      [showMenuButton]="true"
      (toggleSidebar)="sidebarOpen = !sidebarOpen"
    >
    </app-header>

    <div class="flex-1 overflow-y-auto p-4 md:p-8" style="scrollbar-width: none; -ms-overflow-style: none;">
      <style>
        .flex-1::-webkit-scrollbar { display: none; }
      </style>
      <app-admin-reports [hidden]="activeTab !== 'reports' && activeTab !== 'stats'"></app-admin-reports>

      <app-admin-personal
        [hidden]="activeTab !== 'personal'"
      ></app-admin-personal>

      <app-admin-especialidades [hidden]="activeTab !== 'especialidades'"></app-admin-especialidades>
      <app-admin-roles [hidden]="activeTab !== 'roles'"></app-admin-roles>
    </div>
  </main>
</div>
