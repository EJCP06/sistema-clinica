<div class="h-screen bg-slate-50 dark:bg-slate-950 flex overflow-hidden w-full">
  <div class="shrink-0 z-20">
    <app-sidebar
      [activeTab]="activeTab"
      [sidebarOpen]="sidebarOpen"
      (tabChange)="cambiarTab($event)"
      (closeSidebar)="sidebarOpen = false"
    >
    </app-sidebar>
  </div>

  <main
    class="flex-1 flex flex-col min-w-0 overflow-hidden relative bg-slate-50 dark:bg-slate-950 lg:pl-80"
  >
    <app-header
      [title]="
        activeTab === 'reports'
          ? 'Dashboard Global'
          : activeTab === 'stats'
            ? 'Análisis de Datos'
            : activeTab === 'medicos'
              ? 'Cuerpo Médico'
              : activeTab === 'recepcionistas'
                ? 'Personal de Recepción'
                : activeTab === 'administradores'
                  ? 'Panel de Administradores'
                  : activeTab === 'laboratorio'
                    ? 'Personal de Laboratorio'
                  : activeTab === 'imagenes'
                    ? 'Personal de Imágenes'
                    : activeTab === 'aps'
                      ? 'Personal APS'
                      : activeTab === 'especialidades'
                    ? 'Gestión de Especialidades'
                    : 'Gestión de Consultorios'
      "
      [subtitle]="
        activeTab === 'reports'
          ? 'Resumen operativo en tiempo real'
          : activeTab === 'stats'
            ? 'Productividad y tendencias'
            : activeTab === 'medicos'
              ? 'Administración de especialistas clínicos'
              : activeTab === 'recepcionistas'
                ? 'Gestión de operadores de admisión'
                : activeTab === 'administradores'
                  ? 'Control de acceso al sistema'
                  : activeTab === 'laboratorio'
                    ? 'Gestión de técnicos de laboratorio'
                    : activeTab === 'imagenes'
                    ? 'Gestión de técnicos de imágenes'
                    : activeTab === 'aps'
                      ? 'Gestión de personal de atención primaria'
                      : activeTab === 'especialidades'
                    ? 'Configuración de servicios clínicos'
                    : 'Gestión de consultorios and ubicaciones'
      "
      [showLogo]="false"
      [showMenuButton]="true"
      (toggleSidebar)="sidebarOpen = !sidebarOpen"
    >
    </app-header>

    <div class="flex-1 overflow-y-auto p-4 md:p-8" style="scrollbar-width: none; -ms-overflow-style: none;">
      <style>
        .flex-1::-webkit-scrollbar { display: none; }
      </style>
      <app-admin-reports [hidden]="activeTab !== 'reports' && activeTab !== 'stats'"></app-admin-reports>

      <app-admin-personal
        [hidden]="activeTab !== 'medicos' && activeTab !== 'recepcionistas' && activeTab !== 'administradores' && activeTab !== 'laboratorio' && activeTab !== 'imagenes' && activeTab !== 'aps'"
        [activeTab]="activeTab"
      ></app-admin-personal>

      <app-admin-especialidades [hidden]="activeTab !== 'especialidades'"></app-admin-especialidades>
    </div>
  </main>
</div>
