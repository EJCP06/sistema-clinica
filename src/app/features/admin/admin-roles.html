<!--
  Plantilla del panel de Roles (admin-roles.ts).
  Tabla de roles con búsqueda y filtro por sede, modal de creación/edición
  (nombre, sede, estado activo).
-->
<div class="space-y-8 animate-in fade-in duration-500 flex-1 flex flex-col">
  <div class="bg-white dark:bg-slate-900 rounded-[32px] border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden flex-1 flex flex-col">
    <!-- BUSCADOR + BOTONES DENTRO DE LA TABLA -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 px-4 sm:px-6 py-4 border-b border-slate-200 dark:border-slate-800">
      <div class="flex items-center flex-1 min-w-0 gap-2">
        <div class="relative search-filter-container shrink-0">
          <button type="button" (click)="toggleSearchFilterDropdown()" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 px-4 py-3 text-[10px] font-black uppercase tracking-wider text-slate-500 focus:outline-none rounded-2xl cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800 transition-all flex items-center gap-2">
            <span class="uppercase">{{ getSearchFilterLabel(searchFilter) }}</span>
            <lucide-icon [name]="ChevronDown" class="w-3 h-3 transition-transform" [class.rotate-180]="showSearchFilterDropdown"></lucide-icon>
          </button>
          <div *ngIf="showSearchFilterDropdown" class="absolute z-[110] w-40 mt-3 bg-white border border-slate-200 rounded-xl shadow-xl overflow-hidden animate-in fade-in zoom-in duration-200 border-t-4 border-t-blue-600 left-0">
            <div class="p-1 max-h-48 overflow-y-auto">
              <div (click)="selectSearchFilter('todo')" class="px-4 py-2 text-[10px] font-black uppercase tracking-widest hover:bg-slate-50 cursor-pointer transition-colors rounded-lg flex items-center justify-between" [class.bg-blue-50]="searchFilter === 'todo'" [class.text-blue-600]="searchFilter === 'todo'">
                <span>Todo</span>
                <lucide-icon *ngIf="searchFilter === 'todo'" [name]="CheckCircle2" class="w-3 h-3"></lucide-icon>
              </div>
              <div (click)="selectSearchFilter('nombre')" class="px-4 py-2 text-[10px] font-black uppercase tracking-widest hover:bg-slate-50 cursor-pointer transition-colors rounded-lg flex items-center justify-between" [class.bg-blue-50]="searchFilter === 'nombre'" [class.text-blue-600]="searchFilter === 'nombre'">
                <span>Nombres</span>
                <lucide-icon *ngIf="searchFilter === 'nombre'" [name]="CheckCircle2" class="w-3 h-3"></lucide-icon>
              </div>
            </div>
          </div>
        </div>
        <div class="relative flex-1 min-w-0">
          <lucide-icon [name]="Search" class="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-blue-500 transition-colors"></lucide-icon>
          <input type="text" autocomplete="off" [(ngModel)]="searchQuery" placeholder="Buscar rol por nombre, clave o sede..." class="w-full pl-14 pr-10 py-3 text-sm focus:outline-none font-medium bg-slate-100 dark:bg-slate-800 rounded-2xl text-slate-900 dark:text-white" />
        </div>
      </div>
      <div class="grid grid-cols-1 w-full gap-2 sm:flex sm:items-center sm:gap-2 sm:w-auto sm:shrink-0">
        <button *ngIf="tienePermiso('roles_crear')" #btnNuevo (click)="openModalRol(null, btnNuevo)" class="px-4 py-3 sm:px-5 w-full bg-blue-600 hover:bg-blue-700 text-white rounded-2xl shadow-lg shadow-blue-600/20 transition-all flex items-center justify-center gap-2 group whitespace-normal sm:whitespace-nowrap font-bold text-sm">
          <lucide-icon [name]="Plus" class="w-4 h-4"></lucide-icon>
          Nuevo Rol
        </button>
      </div>
    </div>
    <div *ngIf="cargando" class="flex flex-col items-center justify-center py-16 bg-white dark:bg-slate-900/40 border border-slate-200/80 dark:border-slate-800/80 rounded-[32px]">
      <div class="w-8 h-8 border-[3px] border-blue-600/30 border-t-blue-600 rounded-full animate-spin"></div>
      <span class="text-sm text-slate-500 dark:text-slate-400 mt-4 font-semibold animate-pulse">Cargando roles...</span>
    </div>
    <div *ngIf="!cargando" class="flex flex-col justify-between flex-1">
      <div class="overflow-x-auto flex-1">
        <table class="w-full min-w-[700px] text-left text-[11px] sm:text-sm">
          <thead class="bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-800">
            <tr class="h-[52px] md:h-[64px] text-slate-500 font-black text-[9px] sm:text-[10px] uppercase tracking-[2px]">
              <th class="px-1 sm:px-2 md:px-6 py-3 md:py-4 whitespace-nowrap text-center">Nombre</th>
              <th class="px-1 sm:px-2 md:px-6 py-3 md:py-4 whitespace-nowrap text-center">Sede</th>
              <th class="px-1 sm:px-2 md:px-6 py-3 md:py-4 whitespace-nowrap text-center">Estado</th>
              <th class="px-1 sm:px-2 md:px-6 py-3 md:py-4 whitespace-nowrap text-center">Acciones</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100/30 dark:divide-slate-800/10">
            <ng-container *ngFor="let rol of getRolesFiltrados() | paginate: currentPageRoles : pageSize">
              <tr class="h-[52px] md:h-[64px] group hover:bg-slate-50 dark:hover:bg-slate-800">
                <td class="px-1 sm:px-2 md:px-6 py-3 md:py-4 whitespace-nowrap font-bold text-slate-800 dark:text-white tracking-tight uppercase text-center">
                  {{ rol.nombre }}
                </td>
                <td class="px-1 sm:px-2 md:px-6 py-3 md:py-4 whitespace-nowrap font-bold text-slate-800 dark:text-white tracking-tight uppercase text-center">
                  {{ getSedeLabel(rol.id_sede) }}
                </td>
                <td class="px-1 sm:px-2 md:px-6 py-3 md:py-4 whitespace-nowrap text-center">
                  <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest border"
                    [ngClass]="rol.activo ? 'bg-emerald-50 text-emerald-600 border-emerald-200 dark:bg-emerald-500/10 dark:text-emerald-400 dark:border-emerald-500/20' : 'bg-red-50 text-red-600 border-red-200 dark:bg-red-500/10 dark:text-red-400 dark:border-red-500/20'">
                    {{ rol.activo ? 'Activo' : 'Inactivo' }}
                  </span>
                </td>
                <td class="px-1 sm:px-2 md:px-6 py-3 md:py-4 whitespace-nowrap text-center border-b border-slate-100/30 dark:border-slate-800/10">
                  <div class="flex justify-center gap-2">
                    <button *ngIf="tienePermiso('roles_editar')" #btnEdit (click)="openModalRol(rol, btnEdit)" aria-label="Editar rol" class="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded-xl transition-all">
                      <lucide-icon [name]="Edit2" class="w-4 h-4"></lucide-icon>
                    </button>
                    <button *ngIf="tienePermiso('roles_eliminar')" (click)="eliminarRol(rol.id)" aria-label="Eliminar rol" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-900/30 rounded-xl transition-all">
                      <lucide-icon [name]="Trash2" class="w-4 h-4"></lucide-icon>
                    </button>
                  </div>
                </td>
              </tr>
            </ng-container>
            <ng-container *ngIf="getRolesFiltrados().length > 0">
              <ng-container *ngFor="let _ of getRolesFiltrados() | fillers: currentPageRoles : pageSize">
                <tr><td colspan="4" class="h-[52px] md:h-[64px]"></td></tr>
              </ng-container>
            </ng-container>
            <!-- EMPTY STATE -->
            <ng-container *ngIf="getRolesFiltrados().length === 0">
              <tr *ngFor="let _ of fillersVacios; let i = index">
                <td colspan="4" class="h-[52px] md:h-[64px] relative">
                  <div *ngIf="i === 3" class="absolute inset-0 flex flex-col items-center justify-center">
                    <div class="w-10 h-10 rounded-full bg-slate-50 dark:bg-slate-800/50 flex items-center justify-center mb-2">
                      <lucide-icon [name]="Search" class="w-5 h-5 text-slate-500 opacity-60"></lucide-icon>
                    </div>
                    <p class="text-slate-400 italic font-medium text-xs">No se encontraron roles.</p>
                  </div>
                </td>
              </tr>
            </ng-container>
          </tbody>
        </table>
      </div>
      <!-- PAGINACION -->
      <app-pagination
        [totalItems]="getRolesFiltrados().length"
        [pageSize]="pageSize"
        [currentPage]="currentPageRoles"
        (pageChange)="currentPageRoles = $event"
      ></app-pagination>
    </div>
  </div>
</div>

<!-- MODAL CREAR/EDITAR ROL -->
<div *ngIf="showModalRol" class="fixed inset-0 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="modal-rol-title" (keydown.escape)="cerrarModalRol()">
  <div class="absolute inset-0 bg-slate-900/70 backdrop-blur-sm animate-in fade-in duration-300" (click)="cerrarModalRol()"></div>
  <div class="bg-white dark:bg-slate-900 rounded-[32px] shadow-2xl w-full max-w-lg relative z-10 overflow-hidden animate-in zoom-in-95 duration-300 border border-slate-200 dark:border-slate-800 flex flex-col max-h-[90vh] md:max-h-none">
    <!-- Header del modal -->
    <div class="bg-blue-600 p-6 text-white flex items-center justify-between border-b border-blue-500/50">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center">
          <lucide-icon [name]="ShieldCheck" class="w-5 h-5 text-white"></lucide-icon>
        </div>
        <div>
          <h2 id="modal-rol-title" class="text-xl font-black tracking-tight text-white">{{ isEditing ? 'Editar Rol' : 'Nuevo Rol' }}</h2>
          <p class="text-blue-100 text-[10px] uppercase font-bold tracking-widest mt-0.5">Gestión de Acceso y Roles</p>
        </div>
      </div>
      <button (click)="cerrarModalRol()" aria-label="Cerrar formulario" class="p-2 hover:bg-white/10 rounded-lg transition-colors">
        <lucide-icon [name]="XCircle" class="w-5 h-5 text-white"></lucide-icon>
      </button>
    </div>

    <!-- Cuerpo del modal -->
    <div class="p-4 md:p-8 space-y-6 flex-1 overflow-y-auto md:overflow-visible">
      <!-- Nombre del Rol -->
      <div class="space-y-1.5">
        <label class="text-[10px] font-black uppercase tracking-widest text-slate-500 dark:text-slate-400 ml-1">
          Nombre <span class="text-rose-500">*</span>
        </label>
        <input
          type="text"
          [(ngModel)]="formRol.nombre"
          (keypress)="soloLetras($event)"
          (blur)="trimCampo($event)"
          placeholder="Ej: Administrador, Recepcionista..."
          [disabled]="isSaving"
          class="w-full px-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-600 transition-all font-medium text-slate-900 dark:text-white"
        />
      </div>

      <!-- Sede -->
      <div class="space-y-1.5">
        <label class="text-[10px] font-black uppercase tracking-widest text-slate-500 dark:text-slate-400 ml-1">Sede <span class="text-rose-500">*</span></label>
        <div class="flex flex-col sm:flex-row gap-3">
          <label
            *ngFor="let sede of sedes"
            class="flex-1 flex items-center justify-center gap-2 px-4 py-2.5 bg-white dark:bg-slate-800 border rounded-xl cursor-pointer transition-all"
            [class.border-blue-600]="formRol.id_sede === sede.id_sede"
            [class.bg-blue-50]="formRol.id_sede === sede.id_sede"
            [class.dark:bg-blue-950]="formRol.id_sede === sede.id_sede"
            [class.border-slate-200]="formRol.id_sede !== sede.id_sede"
            [class.dark:border-slate-700]="formRol.id_sede !== sede.id_sede"
          >
            <input
              type="radio"
              name="sedeRol"
              [value]="sede.id_sede"
              [checked]="formRol.id_sede === sede.id_sede"
              (change)="selectSede(sede.id_sede)"
              [disabled]="isSaving"
              class="w-4 h-4 text-blue-600"
            />
            <span class="text-sm font-bold text-slate-700 dark:text-white">{{ sede.nombre }}</span>
          </label>
        </div>
      </div>

      <div class="space-y-1.5">
        <label class="text-[10px] font-black uppercase tracking-widest text-slate-500 dark:text-slate-400 ml-1 mb-1">Estado</label>
        <div class="flex items-center gap-2 bg-white dark:bg-transparent border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 w-fit">
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" [(ngModel)]="formRol.activo" class="sr-only peer" />
            <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-teal-500"></div>
          </label>
          <span class="text-[10px] font-bold uppercase tracking-wider" [ngClass]="formRol.activo ? 'text-teal-600 dark:text-teal-400' : 'text-slate-400'">{{ formRol.activo ? 'Si' : 'No' }}</span>
        </div>
      </div>
    </div>

    <!-- Footer del modal -->
    <div class="p-4 md:p-6 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-100 dark:border-slate-800 flex justify-end gap-3 shrink-0 sticky bottom-0 z-10">
      <button
        type="button"
        [disabled]="isSaving"
        (click)="cerrarModalRol()"
        class="px-6 md:px-8 py-3.5 md:py-4 bg-slate-500 hover:bg-slate-600 text-white font-black text-[11px] uppercase tracking-[2px] rounded-xl md:rounded-[20px] transition-all disabled:opacity-50 shadow-lg shadow-slate-500/20 dark:shadow-slate-950/50"
      >CANCELAR</button>
      <button
        type="button"
        [disabled]="isSaving"
        (click)="guardarRol()"
        class="px-6 md:px-10 py-3.5 md:py-4 bg-blue-600 hover:bg-blue-700 text-white font-black text-[11px] uppercase tracking-[2px] rounded-xl md:rounded-[20px] shadow-lg shadow-blue-600/20 dark:shadow-blue-950/50 transition-all flex items-center gap-3 disabled:opacity-50"
      >
        <span *ngIf="!isSaving" class="flex items-center gap-2">{{ isEditing ? 'GUARDAR' : 'CREAR' }}</span>
        <div *ngIf="isSaving" class="flex items-center gap-3 animate-in fade-in slide-in-from-bottom-2 duration-700">
          <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
          <span class="animate-pulse">{{ isEditing ? 'guardando...' : 'creando...' }}</span>
        </div>
      </button>
    </div>
  </div>
</div>
