<!--
  Plantilla del Sidebar compartido (sidebar.ts): menú lateral con las secciones
  Panel / Operaciones / Administración, filtradas según los permisos del
  usuario, más toggle de tema oscuro y cierre de sesión.
-->
<div
  *ngIf="sidebarOpen"
  class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 lg:hidden transition-opacity"
  (click)="closeSidebar.emit()"
></div>

<aside class="w-80 h-[100dvh] bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col fixed left-0 top-0 z-50 transition-transform duration-300"
  [ngClass]="sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'">
  <div class="p-8 flex items-center justify-start relative overflow-hidden">
    <div class="flex items-center gap-4 relative z-10">
      <div class="w-14 h-14 bg-[#ffffff] p-2 rounded-2xl flex items-center justify-center border border-slate-100 dark:border-slate-800 flex-shrink-0">
        <img src="/logo-cnc.png" alt="Logo" class="w-full h-full object-contain" />
      </div>
      <div class="flex flex-col items-center text-center">
        <span class="text-xl font-black tracking-tighter text-slate-900 dark:text-white leading-tight uppercase">Clínica</span>
        <span class="text-xl font-black tracking-tighter text-slate-900 dark:text-white leading-tight uppercase">Nueva Caracas</span>
      </div>
    </div>

    <button
      (click)="closeSidebar.emit()"
      aria-label="Cerrar menú lateral"
      class="lg:hidden absolute right-4 top-8 text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors"
    >
      <lucide-icon [name]="XCircle" class="w-6 h-6"></lucide-icon>
    </button>
  </div>

  <nav class="flex-1 overflow-y-auto p-4 custom-scrollbar touch-scroll">
    <div *ngIf="rol === 'administrador' || tienePermiso('ver_reportes') || tienePermiso('admin_panel')" class="mb-4">
      <button 
        (click)="toggleSection('panel')"
        class="w-full flex items-center justify-between gap-3 mb-1 px-5 py-3 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-2xl transition-all duration-200 group text-left"
      >
        <div class="flex items-center gap-4">
          <lucide-icon [name]="LayoutDashboard" class="w-5 h-5 text-slate-600 dark:text-slate-400"></lucide-icon>
          <p class="font-bold text-[13px] uppercase tracking-wider m-0 text-slate-500 dark:text-slate-400">
            Panel Control
          </p>
        </div>
        <lucide-icon 
          [name]="ChevronDown" 
          class="w-4 h-4 text-slate-900 dark:text-white transition-transform duration-300"
          [class.rotate-180]="expandedPanel"
        ></lucide-icon>
      </button>

      <div class="overflow-hidden transition-all duration-300 px-2" [ngClass]="expandedPanel ? 'max-h-40 opacity-100' : 'max-h-0 opacity-0'">
        <button 
          *ngIf="rol === 'administrador' || tienePermiso('ver_reportes')"
          (click)="navigate('admin', 'reports')"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="BarChart3" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">Dashboard General</span>
        </button>
      </div>
    </div>

    <div *ngIf="tienePermiso('admision:ver') || tienePermiso('aps:ver') || tienePermiso('laboratorio:ver') || tienePermiso('imagenes:ver') || tienePermiso('atencion_medica:ver') || tienePermiso('aseguradoras:ver') || tienePermiso('especialidades:ver')" class="mb-4">
      <button 
        (click)="toggleSection('operaciones')"
        class="w-full flex items-center justify-between gap-3 mb-1 px-5 py-3 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-2xl transition-all duration-200 group text-left"
      >
        <div class="flex items-center gap-4">
          <lucide-icon [name]="Activity" class="w-5 h-5 text-slate-600 dark:text-slate-400"></lucide-icon>
          <p class="font-bold text-[13px] uppercase tracking-wider m-0 text-slate-500 dark:text-slate-400">
            Operaciones
          </p>
        </div>
        <lucide-icon 
          [name]="ChevronDown" 
          class="w-4 h-4 text-slate-900 dark:text-white transition-transform duration-300"
          [class.rotate-180]="expandedOperaciones"
        ></lucide-icon>
      </button>
      
      <div class="space-y-1 overflow-hidden transition-all duration-300 px-2" [ngClass]="expandedOperaciones ? 'max-h-96 opacity-100 mt-1' : 'max-h-0 opacity-0'">
        <button 
          *ngIf="tienePermiso('admision:ver') && !esCoordinador"
          (click)="navigate('recepcion')"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="Users" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">Admisión de Pacientes</span>
        </button>

        <button 
          *ngIf="tienePermiso('aps:ver')"
          (click)="navigate('aps')"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="ClipboardList" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">Atención APS</span>
        </button>

        <button 
          *ngIf="tienePermiso('laboratorio:ver')"
          (click)="navigate('laboratorio')"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="FlaskConical" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">Atención Laboratorio</span>
        </button>

        <button 
          *ngIf="rol === 'laboratorio'"
          (click)="navigate('atencion-laboratorio')"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="FlaskConical" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">Llamado Laboratorio</span>
        </button>

        <button 
          *ngIf="tienePermiso('imagenes:ver')"
          (click)="navigate('imagenes')"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="Image" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">Atención Imágenes</span>
        </button>

        <button 
          *ngIf="rol === 'imagenes'"
          (click)="navigate('atencion-imagenes')"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="Image" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">Llamado Imágenes</span>
        </button>

        <button 
          *ngIf="tienePermiso('atencion_medica:ver')"
          (click)="navigate('atencion')"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="Stethoscope" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">Atención Médica</span>
        </button>

        <button 
          *ngIf="tienePermiso('aseguradoras:ver')"
          (click)="navigate('aseguradoras')"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="ShieldCheck" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">Aseguradoras</span>
        </button>

        <button 
          *ngIf="tienePermiso('especialidades:ver')"
          (click)="navigate('admin', 'especialidades')"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="LayoutGrid" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">Especialidades</span>
        </button>
      </div>
    </div>

    <div *ngIf="tienePermiso('personal:ver') || tienePermiso('roles:ver') || tienePermiso('permisologia:ver')" class="mb-4">
      <button 
        (click)="toggleSection('admin')"
        class="w-full flex items-center justify-between gap-3 mb-1 px-5 py-3 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-2xl transition-all duration-200 group text-left"
      >
        <div class="flex items-center gap-4">
          <lucide-icon [name]="User" class="w-5 h-5 text-slate-600 dark:text-slate-400"></lucide-icon>
          <p class="font-bold text-[13px] uppercase tracking-wider m-0 text-slate-500 dark:text-slate-400">
            Usuarios
          </p>
        </div>
        <lucide-icon 
          [name]="ChevronDown" 
          class="w-4 h-4 text-slate-900 dark:text-white transition-transform duration-300"
          [class.rotate-180]="expandedAdmin"
        ></lucide-icon>
      </button>
      
      <div class="space-y-1 overflow-hidden transition-all duration-300 px-2" [ngClass]="expandedAdmin ? 'max-h-[500px] opacity-100 mt-1' : 'max-h-0 opacity-0'">
        <button
          *ngIf="tienePermiso('personal:ver')"
          (click)="navigate('admin', 'personal')"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="Users" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">Personal</span>
        </button>

        <button
          *ngIf="tienePermiso('roles:ver')"
          (click)="navigate('admin', 'roles')"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="ShieldCheck" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">Roles</span>
        </button>

        <button
          *ngIf="tienePermiso('permisologia:ver')"
          (click)="navigate('admin', 'permisologia')"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="Key" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">Permisología</span>
        </button>
      </div>
    </div>
  </nav>

  <div class="mt-auto shrink-0">
    <div *ngIf="usuario" class="lg:hidden px-4 pb-2">
      <div class="flex flex-col gap-3 p-4 relative overflow-hidden bg-slate-50 dark:bg-slate-800/40 rounded-2xl border border-slate-200 dark:border-slate-700/50 shadow-sm">
        <div class="flex justify-center">
          <span class="px-2.5 py-1 bg-blue-600 text-white text-[9px] font-black uppercase tracking-widest rounded-lg shadow-sm">
            {{ sedeNombre }}
          </span>
        </div>

        <div class="flex items-center gap-3">
          <div class="flex flex-col items-start flex-1 min-w-0">
            <span class="text-sm font-black text-slate-900 dark:text-white truncate w-full tracking-tight uppercase leading-none">{{ usuario.nombre }} {{ usuario.apellido }}</span>
            <div class="flex items-center gap-1.5 mt-1.5">
              <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></div>
              <span class="text-[10px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest">{{ rol }}</span>
            </div>
          </div>
          <div class="w-10 h-10 rounded-xl bg-blue-600/10 dark:bg-blue-500/10 border border-blue-100 dark:border-blue-500/20 flex items-center justify-center shrink-0">
            <lucide-icon [name]="rol === 'administrador' ? Users : (rol === 'recepcionista' ? Ticket : (rol === 'coordinador' || rol === 'analista' ? ClipboardList : (rol === 'laboratorio' ? FlaskConical : (rol === 'imagenes' ? Image : Activity))))" class="w-5 h-5 text-blue-600 dark:text-blue-400"></lucide-icon>
          </div>
        </div>

        <div class="pt-1 flex justify-center">
          <div class="flex items-center gap-4 px-4 py-2 bg-white/50 dark:bg-slate-900/50 rounded-xl border border-slate-100 dark:border-slate-800 shadow-inner">
            <lucide-icon [name]="Sun" class="w-4 h-4 text-amber-500"></lucide-icon>
            <label class="relative inline-flex items-center cursor-pointer group">
              <input type="checkbox" [checked]="isDarkMode" (change)="toggleDarkMode()" class="sr-only peer" />
              <div [class.after:transition-all]="!initialTransitionDisabled" [class.after:duration-300]="!initialTransitionDisabled" class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full dark:bg-slate-700 peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 peer-checked:bg-slate-800 shadow-inner"></div>
            </label>
            <lucide-icon [name]="Moon" class="w-4 h-4 text-slate-300 dark:text-blue-400"></lucide-icon>
          </div>
        </div>
      </div>
    </div>

    <div class="p-6 bg-transparent space-y-4">
        <button
          (click)="logout()"
          [disabled]="cargando"
          class="w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl text-rose-600 dark:text-rose-400 hover:bg-rose-500/5 dark:hover:bg-rose-500/10 disabled:opacity-50 disabled:cursor-not-allowed hover:-translate-y-0.5 active:translate-y-0 transition-all duration-300 group text-left"
        >
          <div class="flex items-center gap-3 min-h-[20px]">
            <span *ngIf="!cargando" class="flex items-center gap-3">
              <lucide-icon
                [name]="LogOut"
                class="w-4 h-4"
              ></lucide-icon>
              <span class="font-bold text-sm tracking-tight">Cerrar Sesión</span>
            </span>
            <div *ngIf="cargando" class="flex items-center gap-3 animate-in fade-in slide-in-from-bottom-2 duration-[800ms]">
              <div class="w-5 h-5 border-2 border-rose-600/30 dark:border-rose-400/30 border-t-rose-600 dark:border-t-rose-400 rounded-full animate-spin"></div>
              <span class="animate-pulse font-bold text-sm tracking-tight">Cargando...</span>
            </div>
          </div>
        </button>
    </div>
  </div>
</aside>
