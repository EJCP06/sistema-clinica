<!-- OVERLAY MOBILE -->
<div
  *ngIf="sidebarOpen"
  class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 lg:hidden transition-opacity"
  (click)="closeSidebar.emit()"
></div>

<aside class="w-80 h-screen bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col fixed left-0 top-0 z-50 transition-transform duration-300"
  [ngClass]="sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'">
  <!-- Logo & Branding -->
  <div class="p-8 flex items-center justify-start relative overflow-hidden sidebar-card">
    <div class="flex items-center gap-4 relative z-10">
      <div class="w-14 h-14 bg-[#ffffff] p-2 rounded-2xl flex items-center justify-center border border-slate-100 dark:border-slate-800 flex-shrink-0">
        <img src="logo-cnc.png" alt="Logo" class="w-full h-full object-contain" />
      </div>
      <div class="flex flex-col items-center text-center">
        <span class="text-xl font-black tracking-tighter text-slate-900 dark:text-white leading-tight uppercase">Clinica</span>
        <span class="text-xl font-black tracking-tighter text-slate-900 dark:text-white leading-tight uppercase">Nueva Caracas</span>
      </div>
    </div>

    <!-- Botón Cerrar (Mobile) -->
    <button
      (click)="closeSidebar.emit()"
      aria-label="Cerrar menú lateral"
      class="lg:hidden absolute right-4 top-8 text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors"
    >
      <lucide-icon [name]="XCircle" class="w-6 h-6"></lucide-icon>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto p-4 custom-scrollbar touch-scroll">    <!-- PANEL CONTROL (Solo Admin) -->
    <div *ngIf="rol === 'admin'" class="mb-4">
      <button 
        (click)="toggleSection('panel')"
        class="w-full flex items-center justify-between gap-3 mb-1 px-5 py-3 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-2xl transition-all duration-200 group text-left"
      >
        <div class="flex items-center gap-4">
          <lucide-icon [name]="LayoutDashboard" class="w-5 h-5 text-slate-600 dark:text-slate-400"></lucide-icon>
          <p class="font-bold text-[13px] uppercase tracking-wider m-0 text-slate-500 dark:text-slate-400">
            Panel Control
          </p>
        </div>
        <lucide-icon 
          [name]="ChevronDown" 
          class="w-4 h-4 text-slate-900 dark:text-white transition-transform duration-300"
          [class.rotate-180]="expandedPanel"
        ></lucide-icon>
      </button>

      <div class="overflow-hidden transition-all duration-300 px-2" [ngClass]="expandedPanel ? 'max-h-40 opacity-100' : 'max-h-0 opacity-0'">
        <button 
          (click)="navigate('admin', 'reports')"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="BarChart3" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">Dashboard General</span>
        </button>
      </div>
    </div>

    <!-- OPERACIONES -->
    <div *ngIf="['admin', 'recepcionista', 'medico', 'aps', 'laboratorio', 'imagenes'].includes(rol)" class="mb-4">
      <button 
        (click)="toggleSection('operaciones')"
        class="w-full flex items-center justify-between gap-3 mb-1 px-5 py-3 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-2xl transition-all duration-200 group text-left"
      >
        <div class="flex items-center gap-4">
          <lucide-icon [name]="Activity" class="w-5 h-5 text-slate-600 dark:text-slate-400"></lucide-icon>
          <p class="font-bold text-[13px] uppercase tracking-wider m-0 text-slate-500 dark:text-slate-400">
            Operaciones
          </p>
        </div>
        <lucide-icon 
          [name]="ChevronDown" 
          class="w-4 h-4 text-slate-900 dark:text-white transition-transform duration-300"
          [class.rotate-180]="expandedOperaciones"
        ></lucide-icon>
      </button>
      
      <div class="space-y-1 overflow-hidden transition-all duration-300 px-2" [ngClass]="expandedOperaciones ? 'max-h-96 opacity-100 mt-1' : 'max-h-0 opacity-0'">
        <button 
          *ngIf="['admin', 'recepcionista'].includes(rol)"
          (click)="navigate('recepcion')"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="Users" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">Admisión de Pacientes</span>
        </button>

        <button 
          *ngIf="['admin', 'aps'].includes(rol)"
          (click)="navigate('aps')"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="ClipboardList" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">Atención APS</span>
        </button>

        <button 
          *ngIf="['admin', 'laboratorio'].includes(rol)"
          (click)="navigate('atencion-laboratorio')"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="FlaskConical" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">Atención Laboratorio</span>
        </button>

        <button 
          *ngIf="rol === 'laboratorio'"
          (click)="navigate('atencion', { tipo: 'laboratorio' })"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="Megaphone" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">Llamado</span>
        </button>

        <button 
          *ngIf="['admin', 'imagenes'].includes(rol)"
          (click)="navigate('atencion-imagenes')"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="Image" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">Atención Imágenes</span>
        </button>

        <button 
          *ngIf="rol === 'imagenes'"
          (click)="navigate('atencion', { tipo: 'imagenes' })"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="Megaphone" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">Llamado</span>
        </button>

        <button 
          *ngIf="['aps', 'admin'].includes(rol)"
          (click)="navigate('aseguradoras')"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="ShieldCheck" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">Aseguradoras</span>
        </button>

        <button 
          *ngIf="rol === 'medico'"
          (click)="navigate('atencion')"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="Stethoscope" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">Atención Médica</span>
        </button>

      </div>
    </div>

    <!-- ADMINISTRACIÓN -->
    <div *ngIf="rol === 'admin'" class="mb-4">
      <button 
        (click)="toggleSection('admin')"
        class="w-full flex items-center justify-between gap-3 mb-1 px-5 py-3 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-2xl transition-all duration-200 group text-left"
      >
        <div class="flex items-center gap-4">
          <lucide-icon [name]="ShieldCheck" class="w-5 h-5 text-slate-600 dark:text-slate-400"></lucide-icon>
          <p class="font-bold text-[13px] uppercase tracking-wider m-0 text-slate-500 dark:text-slate-400">
            Roles
          </p>
        </div>
        <lucide-icon 
          [name]="ChevronDown" 
          class="w-4 h-4 text-slate-900 dark:text-white transition-transform duration-300"
          [class.rotate-180]="expandedAdmin"
        ></lucide-icon>
      </button>
      
      <div class="space-y-1 overflow-hidden transition-all duration-300 px-2" [ngClass]="expandedAdmin ? 'max-h-[500px] opacity-100 mt-1' : 'max-h-0 opacity-0'">
        <button 
          (click)="navigate('admin', 'medicos')"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="UserCog" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">Médicos</span>
        </button>

        <button 
          (click)="navigate('admin', 'recepcionistas')"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="Users" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">Recepcionistas</span>
        </button>

        <button 
          (click)="navigate('admin', 'administradores')"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="ShieldCheck" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">Administradores</span>
        </button>

        <button 
          (click)="navigate('admin', 'especialidades')"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="LayoutGrid" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">Especialidades</span>
        </button>

        <button 
          (click)="navigate('admin', 'aps')"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="ClipboardList" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">APS</span>
        </button>

        <button 
          (click)="navigate('admin', 'laboratorio')"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="FlaskConical" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">Laboratorio</span>
        </button>

        <button 
          (click)="navigate('admin', 'imagenes')"
          class="w-full flex items-center gap-4 px-5 py-3 rounded-2xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all duration-200 group text-left"
        >
          <lucide-icon [name]="Image" class="w-5 h-5 text-slate-400 dark:text-slate-400"></lucide-icon>
          <span class="font-bold text-[13px] uppercase tracking-wider">Imágenes</span>
        </button>

      </div>
    </div>
  </nav>

  <!-- Footer -->
  <div class="p-6 bg-transparent space-y-4 shrink-0">
    <!-- Perfil del Usuario (Visible solo en Mobile) -->
    <div *ngIf="usuario" class="lg:hidden flex flex-col gap-4 p-5 mb-8 relative overflow-hidden bg-slate-50 dark:bg-slate-800/50 rounded-3xl border-t border-r border-l border-slate-200 dark:border-slate-800 shadow-sm mobile-profile-card">
      <!-- Badge de Sede (Centrado) -->
      <div class="flex justify-center">
        <span class="px-3 py-1 bg-blue-600 text-white text-[9px] font-black uppercase tracking-widest rounded-xl shadow-sm">
          {{ sedeNombre }}
        </span>
      </div>

      <div class="flex items-center gap-4">
        <div class="flex flex-col items-start flex-1 min-w-0">
          <span class="text-base font-black text-slate-900 dark:text-white truncate w-full tracking-tighter uppercase leading-none">{{ usuario.nombre }} {{ usuario.apellido }}</span>
          <div class="flex items-center gap-1.5 mt-2">
            <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></div>
            <span class="text-[10px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest">{{ rol }}</span>
          </div>
        </div>
        <div class="w-12 h-12 rounded-2xl bg-blue-600/10 dark:bg-blue-500/10 border border-blue-100 dark:border-blue-500/20 flex items-center justify-center shrink-0">
          <lucide-icon [name]="rol === 'admin' ? Users : (rol === 'recepcionista' ? Ticket : (rol === 'aps' ? ClipboardList : (rol === 'laboratorio' ? FlaskConical : (rol === 'imagenes' ? Image : Activity))))" class="w-6 h-6 text-blue-600 dark:text-blue-400"></lucide-icon>
        </div>
      </div>

      <!-- Theme Toggle Centrado (Idéntico a Computadora) -->
      <div class="pt-2 flex justify-center">
        <div class="flex items-center gap-4 px-5 py-2 bg-white/50 dark:bg-slate-900/50 rounded-2xl border border-slate-100 dark:border-slate-800 shadow-inner">
          <lucide-icon [name]="Sun" class="w-4 h-4 text-amber-500"></lucide-icon>
          <label class="relative inline-flex items-center cursor-pointer group">
            <input type="checkbox" [checked]="isDarkMode" (change)="toggleDarkMode()" class="sr-only peer" />
            <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-slate-800 shadow-inner"></div>
          </label>
          <lucide-icon [name]="Moon" class="w-4 h-4 text-slate-300 dark:text-blue-400"></lucide-icon>
        </div>
      </div>
    </div>

    <div class="sticky-footer">
      <button
        (click)="logout()"
        class="w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl text-rose-600 dark:text-rose-400 hover:bg-rose-500/5 dark:hover:bg-rose-500/10 transition-all duration-300 group text-left"
      >
        <lucide-icon
          [name]="LogOut"
          class="w-4 h-4 transition-transform group-hover:-translate-x-1"
        ></lucide-icon>
        <span class="font-bold text-sm tracking-tight">Cerrar Sesión</span>
      </button>
    </div>
  </div>
</aside>
