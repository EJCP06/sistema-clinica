<!-- Backdrop invisible para cerrar al hacer click fuera -->
<div *ngIf="panelOpen" class="fixed inset-0 z-[80]" (click)="panelOpen = false"></div>

<!-- Botón flotante de ayuda -->
<div class="fixed bottom-6 right-6 z-[90] flex flex-col items-end gap-3">
  <!-- Panel expandible -->
  <div
    *ngIf="panelOpen"
    class="help-panel bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 w-80 overflow-hidden animate-in fade-in zoom-in-95 duration-200"
  >
    <!-- Header del panel -->
    <div class="bg-blue-600 p-5 text-white flex items-center justify-between">
      <div>
        <h3 class="font-black text-sm tracking-tight m-0">Guía Rápida del Sistema</h3>
        <p class="text-blue-200 text-[10px] uppercase font-bold tracking-widest mt-0.5 m-0">
          Tour interactivo
        </p>
      </div>
      <button
        (click)="panelOpen = false"
        class="p-1.5 hover:bg-white/10 rounded-lg transition-colors"
      >
        <lucide-icon [name]="X" class="w-4 h-4 text-white"></lucide-icon>
      </button>
    </div>

    <!-- Contenido -->
    <div class="p-5 space-y-4">
      <!-- Progreso del tour -->
      <div *ngIf="!tourCompleted" class="flex flex-col items-center gap-3 py-4">
        <div class="relative w-24 h-24">
          <svg class="w-full h-full transform -rotate-90">
            <circle
              class="text-slate-200 dark:text-slate-700"
              cx="48"
              cy="48"
              r="40"
              fill="none"
              stroke="currentColor"
              stroke-width="6"
            />
            <circle
              class="text-blue-600 transition-all duration-500 ease-out"
              cx="48"
              cy="48"
              r="40"
              fill="none"
              stroke="currentColor"
              stroke-width="6"
              stroke-linecap="round"
              [attr.stroke-dasharray]="251.33"
              [attr.stroke-dashoffset]="251.33 - (tourProgress / 100) * 251.33"
            />
          </svg>
          <div class="absolute inset-0 flex items-center justify-center">
            <span class="font-black text-lg text-slate-900 dark:text-white">{{ tourProgress }}%</span>
          </div>
        </div>
        <p class="text-xs font-bold text-slate-500 dark:text-slate-400 m-0">Progreso de la guía</p>
      </div>

      <!-- Estado completado -->
      <div *ngIf="tourCompleted" class="flex flex-col items-center gap-3 py-4">
        <div class="w-20 h-20 bg-emerald-100 dark:bg-emerald-900/30 rounded-full flex items-center justify-center">
          <lucide-icon [name]="CheckCircle" class="w-10 h-10 text-emerald-600 dark:text-emerald-400"></lucide-icon>
        </div>
        <p class="font-black text-sm text-emerald-700 dark:text-emerald-400 m-0">¡Tour completado!</p>
        <p class="text-[11px] text-slate-500 dark:text-slate-400 m-0 text-center">Has finalizado la guía interactiva del sistema.</p>
      </div>

      <!-- Botones de acción -->
      <div class="flex gap-2">
        <button
          *ngIf="!isTourRunning"
          (click)="startTour()"
          class="flex-1 flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-black py-3 rounded-xl shadow-lg shadow-blue-600/20 transition-all text-[11px] uppercase tracking-widest active:scale-95"
        >
          <lucide-icon [name]="Play" class="w-4 h-4"></lucide-icon>
          {{ hasSeen || tourCompleted ? 'Repetir Tour' : 'Iniciar Tour' }}
        </button>
      </div>

      <!-- Reset (solo si ya vio el tour o completó) -->
      <button
        *ngIf="hasSeen || tourCompleted"
        (click)="resetTour()"
        class="w-full flex items-center justify-center gap-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 text-[10px] font-bold uppercase tracking-widest transition-colors py-1"
      >
        <lucide-icon [name]="RotateCcw" class="w-3 h-3"></lucide-icon>
        Restablecer tour
      </button>
    </div>
  </div>

  <!-- Botón flotante -->
  <button
    (click)="$event.stopPropagation(); togglePanel()"
    class="w-14 h-14 bg-blue-600 hover:bg-blue-700 text-white rounded-full shadow-xl shadow-blue-600/30 hover:shadow-blue-600/50 transition-all duration-300 flex items-center justify-center group active:scale-90"
    [title]="panelOpen ? 'Cerrar ayuda' : 'Ayuda del sistema'"
  >
    <lucide-icon
      [name]="panelOpen ? X : HelpCircle"
      class="w-6 h-6 transition-transform group-hover:scale-110"
    ></lucide-icon>
  </button>
</div>
