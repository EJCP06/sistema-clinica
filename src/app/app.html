<!--
  Plantilla del componente raíz (App).
  Solo contiene el <router-outlet />: cada ruta cargará su propia vista
  (ver app.routes.ts). La lógica de verificación/renovación de sesión vive
  en app.ts.
-->
<router-outlet />

<!-- Botón flotante de ayuda para el tour guiado (solo dentro del sistema) -->
<app-help-button *ngIf="auth.isTokenValid() && !isPublicRoute" />

<!-- Componente del tour (renderiza los tooltips del tour) -->
<ng-template #defaultStepTemplate let-step="step">
  <!-- PASO CON ACCORDION: infoSections -->
  <div *ngIf="step.infoSections?.length" class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 p-5 w-96" (click)="$event.stopPropagation()">
    <div class="flex items-start justify-between mb-3">
      <h3 class="font-black text-sm text-slate-900 dark:text-white tracking-tight m-0">{{ step.title }}</h3>
      <button (click)="$event.stopPropagation(); tourEnd()" class="p-1 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors" title="Cerrar tour">
        <svg class="w-4 h-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <p class="text-xs text-slate-600 dark:text-slate-400 font-medium leading-relaxed m-0 mb-3">{{ step.content }}</p>

    <div class="space-y-1 mb-4">
      <div *ngFor="let section of step.infoSections; let i = index">
        <button (click)="$event.stopPropagation(); toggleTourSection(i)"
          class="w-full flex items-center justify-between gap-2 px-3 py-2 rounded-xl text-left transition-all duration-200 hover:bg-slate-50 dark:hover:bg-slate-800 border border-slate-100 dark:border-slate-700"
          [class.bg-slate-50]="tourSectionOpen === i"
          [class.dark:bg-slate-800]="tourSectionOpen === i"
          [class.border-blue-200]="tourSectionOpen === i"
          [class.dark:border-blue-800]="tourSectionOpen === i">
          <span class="font-bold text-[11px] uppercase tracking-wider text-slate-700 dark:text-slate-300">{{ section.title }}</span>
          <svg class="w-3 h-3 text-slate-400 transition-transform duration-200" [class.rotate-180]="tourSectionOpen === i" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </button>
        <div class="overflow-hidden transition-all duration-200" [style.max-height]="tourSectionOpen === i ? '200px' : '0'" [style.opacity]="tourSectionOpen === i ? '1' : '0'">
          <p class="text-xs text-slate-600 dark:text-slate-400 font-medium leading-relaxed px-3 py-2">{{ section.content }}</p>
        </div>
      </div>
    </div>

    <div class="flex items-center justify-between">
      <div class="flex gap-2">
        <button (click)="$event.stopPropagation(); tourPrev()" class="px-3 py-1.5 text-[10px] font-black uppercase tracking-widest text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors">Anterior</button>
        <button *ngIf="hasNext(step)" (click)="$event.stopPropagation(); tourNext()" class="px-3 py-1.5 text-[10px] font-black uppercase tracking-widest text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors">Siguiente</button>
        <button *ngIf="!hasNext(step)" (click)="$event.stopPropagation(); tourEnd(true)" class="px-3 py-1.5 text-[10px] font-black uppercase tracking-widest text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors">Finalizar</button>
      </div>
    </div>
  </div>

  <!-- PASO NORMAL: tooltip estándar -->
  <div *ngIf="!step.infoSections?.length" class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 p-5 w-96" (click)="$event.stopPropagation()">
    <div class="flex items-start justify-between mb-3">
      <h3 class="font-black text-sm text-slate-900 dark:text-white tracking-tight m-0">{{ step.title }}</h3>
      <button (click)="$event.stopPropagation(); tourEnd()" class="p-1 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors" title="Cerrar tour">
        <svg class="w-4 h-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <p class="text-xs text-slate-600 dark:text-slate-400 font-medium leading-relaxed m-0 mb-4">{{ step.content }}</p>
    <div class="flex items-center justify-between">
      <div class="flex gap-2">
        <button (click)="$event.stopPropagation(); tourPrev()" class="px-3 py-1.5 text-[10px] font-black uppercase tracking-widest text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors">Anterior</button>
        <button *ngIf="hasNext(step)" (click)="$event.stopPropagation(); tourNext()" class="px-3 py-1.5 text-[10px] font-black uppercase tracking-widest text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors">Siguiente</button>
        <button *ngIf="!hasNext(step)" (click)="$event.stopPropagation(); tourEnd(true)" class="px-3 py-1.5 text-[10px] font-black uppercase tracking-widest text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition-colors">Finalizar</button>
      </div>
    </div>
  </div>
</ng-template>
<tour-step-template [stepTemplate]="defaultStepTemplate" />
