<!--
  Documento raíz de la aplicación Angular (SPA).
  Angular inyecta el componente raíz (App) en <app-root> vía src/main.ts.
  Aquí solo se cargan los estilos globales (styles.css) y el favicon;
  los scripts los genera el compilador de Angular automáticamente.
-->
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Clínica Nueva Caracas</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="logo-cnc.png" />
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('theme');
          const isDark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
